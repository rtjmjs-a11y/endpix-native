plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}
android {
    namespace 'com.endpix.nativeapp'
    compileSdk 36
    buildToolsVersion '36.0.0'
    ndkVersion '27.2.12479018'
    defaultConfig {
        applicationId 'com.endpix.nativeapp'
        minSdk 26
        targetSdk 36
        versionCode 166
        versionName 'pn166'
        externalNativeBuild { cmake { cppFlags '-std=c++20 -O3 -funroll-loops -march=armv8.2-a+dotprod' } }
        ndk { abiFilters 'arm64-v8a' }
    }
    externalNativeBuild {
        cmake { path file('src/main/cpp/CMakeLists.txt') }
    }
    buildFeatures { compose true }
    packagingOptions {
        // xray 是 Go 可执行文件, 伪装成 libxray.so 放进 jniLibs;
        // 不能让 AGP 用 NDK strip 处理, 否则会损坏
        jniLibs { keepDebugSymbols += '**/libxray.so' }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            ndk { debugSymbolLevel 'none' }
        }
        debug {
            // 发布/对比体积: 用 R8 跑一遍(不影响日常调试)
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
}
dependencies {
    implementation platform('androidx.compose:compose-bom:2024.09.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.activity:activity-compose:1.9.2'
    implementation 'androidx.webkit:webkit:1.11.0'
}
